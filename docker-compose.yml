services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: enterprise-rag-pgvector
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-rag-app
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      PG_URL: jdbc:postgresql://pgvector:5432/kb
      PG_USERNAME: kb
      PG_PASSWORD: kb
      EMBEDDING_PROVIDER: transformers
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-unused}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgvector-data:
